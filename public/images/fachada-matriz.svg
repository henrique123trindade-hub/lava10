<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="buildingUpper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="blueBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E2A6D" />
      <stop offset="50%" stop-color="#123B8E" />
      <stop offset="100%" stop-color="#1A4FC2" />
    </linearGradient>
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="30%" stop-color="#E0F2FE" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#BAE6FD" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="machineMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="drumGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
    <filter id="signGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Sky & Upper Building Structure -->
  <rect width="1200" height="800" fill="#F8FAFC" />
  
  <!-- Architectural Top Wall -->
  <rect x="0" y="0" width="1200" height="150" fill="url(#buildingUpper)" />
  
  <!-- Royal Blue Band on Top -->
  <rect x="0" y="70" width="1200" height="75" fill="url(#blueBand)" />
  <line x1="0" y1="145" x2="1200" y2="145" stroke="#0E2A6D" stroke-width="3" />

  <!-- Main White Facade Panel -->
  <g filter="url(#subtleShadow)">
    <rect x="40" y="125" width="1120" height="230" rx="4" fill="#FFFFFF" />
    <rect x="40" y="125" width="1120" height="6" fill="#123B8E" opacity="0.9" />
  </g>

  <!-- Facade Typography: LAVANDERIA AUTO ATENDIMENTO -->
  <text x="560" y="240" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="86" font-weight="900" fill="#123B8E" letter-spacing="4" text-anchor="middle">
    LAVANDERIA
  </text>
  <text x="560" y="315" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="44" font-weight="800" fill="#123B8E" letter-spacing="9" text-anchor="middle">
    AUTO ATENDIMENTO
  </text>

  <!-- Yellow Accent Line Under Logo Text -->
  <rect x="360" y="332" width="400" height="5" rx="2.5" fill="#F5C400" />

  <!-- Circular 3D Hanging Blade Sign on Upper Right -->
  <g transform="translate(1010, 110)" filter="url(#signGlow)">
    <!-- Mounting Bracket -->
    <rect x="-35" y="45" width="40" height="12" fill="#1E293B" />
    <rect x="-35" y="115" width="40" height="12" fill="#1E293B" />
    <rect x="-42" y="30" width="10" height="110" rx="2" fill="#0F172A" />

    <!-- Blue Sign Disc -->
    <circle cx="65" cy="85" r="85" fill="#123B8E" stroke="#FFFFFF" stroke-width="6" />
    <circle cx="65" cy="85" r="76" fill="#0E2A6D" stroke="#3B82F6" stroke-width="2" />
    
    <!-- Top Arched Text: LAVANDERIA -->
    <path id="curveTopSign" d="M 0,85 A 65,65 0 0,1 130,85" fill="none" />
    <text font-family="'Montserrat', sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" letter-spacing="2">
      <textPath href="#curveTopSign" startOffset="50%" text-anchor="middle">
        LAVANDERIA
      </textPath>
    </text>

    <!-- Center Machine & LAVA 10 -->
    <g transform="translate(38, 55)">
      <!-- Washing Machine Body -->
      <rect x="8" y="4" width="38" height="42" rx="4" fill="#FFFFFF" />
      <circle cx="27" cy="24" r="13" fill="#123B8E" />
      <circle cx="27" cy="24" r="9" fill="#93C5FD" />
      <!-- LAVA 10 -->
      <text x="27" y="58" font-family="'Montserrat', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
        LAVA 10
      </text>
    </g>

    <!-- Bottom Arched Text: AUTO ATENDIMENTO -->
    <path id="curveBottomSign" d="M 125,85 A 60,60 0 0,1 5,85" fill="none" />
    <text font-family="'Montserrat', sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">
      <textPath href="#curveBottomSign" startOffset="50%" text-anchor="middle">
        AUTO ATENDIMENTO
      </textPath>
    </text>
  </g>

  <!-- Storefront Glass Window & Entrance Structure -->
  <rect x="70" y="355" width="1060" height="380" fill="#0F172A" />
  
  <!-- Interior: Floor & Walls -->
  <!-- Back Wall with White Tiles & Soft Light -->
  <rect x="70" y="355" width="1060" height="230" fill="#F1F5F9" />
  <line x1="70" y1="440" x2="1130" y2="440" stroke="#E2E8F0" stroke-width="1" />
  <line x1="70" y1="510" x2="1130" y2="510" stroke="#E2E8F0" stroke-width="1" />
  
  <!-- Interior Floor (Clean Light Grey Tiles) -->
  <polygon points="70,585 1130,585 1130,735 70,735" fill="#E2E8F0" />
  <line x1="280" y1="585" x2="210" y2="735" stroke="#CBD5E1" stroke-width="2" />
  <line x1="560" y1="585" x2="520" y2="735" stroke="#CBD5E1" stroke-width="2" />
  <line x1="840" y1="585" x2="830" y2="735" stroke="#CBD5E1" stroke-width="2" />

  <!-- Commercial Washing Machines & Dryers inside -->
  <!-- Machine 1 -->
  <g transform="translate(130, 420)">
    <rect x="0" y="0" width="110" height="175" rx="6" fill="url(#machineMetal)" stroke="#64748B" stroke-width="2" />
    <rect x="10" y="10" width="90" height="25" rx="3" fill="#1E293B" />
    <circle cx="25" cy="22" r="4" fill="#22C55E" />
    <rect x="40" y="18" width="45" height="9" rx="2" fill="#38BDF8" />
    <!-- Round Drum Door -->
    <circle cx="55" cy="95" r="42" fill="#475569" stroke="#94A3B8" stroke-width="5" />
    <circle cx="55" cy="95" r="33" fill="url(#drumGlass)" />
    <ellipse cx="65" cy="85" rx="14" ry="7" fill="#64748B" opacity="0.6" transform="rotate(-30 65 85)" />
    <!-- Base -->
    <rect x="10" y="155" width="90" height="12" fill="#334155" />
  </g>

  <!-- Machine 2 -->
  <g transform="translate(260, 420)">
    <rect x="0" y="0" width="110" height="175" rx="6" fill="url(#machineMetal)" stroke="#64748B" stroke-width="2" />
    <rect x="10" y="10" width="90" height="25" rx="3" fill="#1E293B" />
    <circle cx="25" cy="22" r="4" fill="#22C55E" />
    <rect x="40" y="18" width="45" height="9" rx="2" fill="#38BDF8" />
    <circle cx="55" cy="95" r="42" fill="#475569" stroke="#94A3B8" stroke-width="5" />
    <circle cx="55" cy="95" r="33" fill="url(#drumGlass)" />
    <ellipse cx="65" cy="85" rx="14" ry="7" fill="#64748B" opacity="0.6" transform="rotate(-30 65 85)" />
    <rect x="10" y="155" width="90" height="12" fill="#334155" />
  </g>

  <!-- Center Laundry Folding Table (As seen in the photo) -->
  <g transform="translate(420, 480)">
    <!-- White Table Top -->
    <polygon points="0,35 240,35 270,60 -30,60" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <rect x="-30" y="60" width="300" height="10" fill="#E2E8F0" />
    <!-- Black Metal Frame & Legs -->
    <line x1="-25" y1="70" x2="-25" y2="175" stroke="#1E293B" stroke-width="8" />
    <line x1="265" y1="70" x2="265" y2="175" stroke="#1E293B" stroke-width="8" />
    <line x1="5" y1="65" x2="5" y2="155" stroke="#334155" stroke-width="6" />
    <line x1="235" y1="65" x2="235" y2="155" stroke="#334155" stroke-width="6" />
    <line x1="-25" y1="135" x2="265" y2="135" stroke="#1E293B" stroke-width="6" />
  </g>

  <!-- Machine 3 & 4 (Right Side) -->
  <g transform="translate(730, 420)">
    <rect x="0" y="0" width="110" height="175" rx="6" fill="url(#machineMetal)" stroke="#64748B" stroke-width="2" />
    <rect x="10" y="10" width="90" height="25" rx="3" fill="#1E293B" />
    <circle cx="25" cy="22" r="4" fill="#22C55E" />
    <rect x="40" y="18" width="45" height="9" rx="2" fill="#38BDF8" />
    <circle cx="55" cy="95" r="42" fill="#475569" stroke="#94A3B8" stroke-width="5" />
    <circle cx="55" cy="95" r="33" fill="url(#drumGlass)" />
    <ellipse cx="65" cy="85" rx="14" ry="7" fill="#64748B" opacity="0.6" transform="rotate(-30 65 85)" />
    <rect x="10" y="155" width="90" height="12" fill="#334155" />
  </g>

  <g transform="translate(860, 420)">
    <rect x="0" y="0" width="110" height="175" rx="6" fill="url(#machineMetal)" stroke="#64748B" stroke-width="2" />
    <rect x="10" y="10" width="90" height="25" rx="3" fill="#1E293B" />
    <circle cx="25" cy="22" r="4" fill="#22C55E" />
    <rect x="40" y="18" width="45" height="9" rx="2" fill="#38BDF8" />
    <circle cx="55" cy="95" r="42" fill="#475569" stroke="#94A3B8" stroke-width="5" />
    <circle cx="55" cy="95" r="33" fill="url(#drumGlass)" />
    <ellipse cx="65" cy="85" rx="14" ry="7" fill="#64748B" opacity="0.6" transform="rotate(-30 65 85)" />
    <rect x="10" y="155" width="90" height="12" fill="#334155" />
  </g>

  <!-- Large Glass Front Frame & Doors -->
  <!-- Glass Shading & Diagonal Specular Highlights -->
  <rect x="70" y="355" width="1060" height="380" fill="url(#glassReflect)" />

  <!-- Official Circular Logo Decal on Left Glass Window (as seen in photo) -->
  <g transform="translate(230, 440)" opacity="0.95">
    <circle cx="45" cy="45" r="42" fill="#123B8E" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="45" cy="45" r="37" fill="#0E2A6D" />
    <!-- Washer Icon -->
    <rect x="33" y="27" width="24" height="26" rx="3" fill="#FFFFFF" />
    <circle cx="45" cy="40" r="8" fill="#123B8E" />
    <circle cx="45" cy="40" r="5" fill="#93C5FD" />
    <!-- Text -->
    <text x="45" y="60" font-family="'Montserrat', sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">
      LAVA 10
    </text>
  </g>

  <!-- White Commercial Aluminum Door Frames -->
  <!-- Outer Perimeter -->
  <rect x="70" y="355" width="1060" height="380" fill="none" stroke="#FFFFFF" stroke-width="12" />
  <rect x="70" y="355" width="1060" height="380" fill="none" stroke="#94A3B8" stroke-width="2" />
  
  <!-- Vertical Glass Dividers -->
  <line x1="390" y1="355" x2="390" y2="735" stroke="#FFFFFF" stroke-width="10" />
  <line x1="390" y1="355" x2="390" y2="735" stroke="#94A3B8" stroke-width="1.5" />
  <line x1="710" y1="355" x2="710" y2="735" stroke="#FFFFFF" stroke-width="10" />
  <line x1="710" y1="355" x2="710" y2="735" stroke="#94A3B8" stroke-width="1.5" />
  
  <!-- Center Sliding Door Vertical Handle (as in photo) -->
  <rect x="704" y="490" width="12" height="110" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="2" filter="url(#subtleShadow)" />

  <!-- Lower Glass Frosted Privacy Film Band (as seen in photo) -->
  <rect x="76" y="615" width="1048" height="115" fill="#E2E8F0" opacity="0.45" />
  <line x1="76" y1="615" x2="1124" y2="615" stroke="#FFFFFF" stroke-width="3" opacity="0.8" />

  <!-- Sidewalk Pavement in Foreground -->
  <polygon points="0,735 1200,735 1200,800 0,800" fill="#64748B" />
  <rect x="0" y="735" width="1200" height="12" fill="#475569" />
  <!-- Paver Lines -->
  <g stroke="#334155" stroke-width="2" opacity="0.5">
    <line x1="100" y1="747" x2="60" y2="800" />
    <line x1="250" y1="747" x2="220" y2="800" />
    <line x1="400" y1="747" x2="380" y2="800" />
    <line x1="550" y1="747" x2="540" y2="800" />
    <line x1="700" y1="747" x2="700" y2="800" />
    <line x1="850" y1="747" x2="860" y2="800" />
    <line x1="1000" y1="747" x2="1020" y2="800" />
    <line x1="1150" y1="747" x2="1180" y2="800" />
  </g>

  <!-- Location Badge Overlay (Centro - Rua Andrade Neves, 1620) -->
  <g transform="translate(90, 145)">
    <rect width="260" height="34" rx="17" fill="#123B8E" />
    <circle cx="17" cy="17" r="10" fill="#F5C400" />
    <text x="17" y="21" font-family="'Montserrat', sans-serif" font-size="11" font-weight="900" fill="#0E2A6D" text-anchor="middle">★</text>
    <text x="36" y="22" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="1">
      MATRIZ &bull; CENTRO
    </text>
  </g>
</svg>
